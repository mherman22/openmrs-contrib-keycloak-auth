name: Build with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    uses: openmrs/openmrs-contrib-gha-workflows/.github/workflows/build-maven.yml@main
    with:
      java_versions: '[17, 21]'
      main_java_version: '17'
      deploy_snapshots: false
